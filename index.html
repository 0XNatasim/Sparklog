<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#151515" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SparkLog</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Launch splash: shows the Messier wordmark while the installed app boots.
         Removed immediately in a normal browser tab; hidden by main.jsx once the
         app has painted. -->
    <div id="app-splash" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#151515;opacity:1;transition:opacity .4s ease">
      <img src="/header-dark.jpg" alt="Messier Connexion" style="width:82%;max-width:440px;height:auto" />
    </div>
    <script>
      (function () {
        try {
          var standalone = window.matchMedia("(display-mode: standalone)").matches
            || window.navigator.standalone === true;
          if (!standalone) {
            var s = document.getElementById("app-splash");
            if (s) s.remove();
          }
        } catch (e) { /* leave splash for main.jsx to remove */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
