<svg xmlns="http://www.w3.org/2000/svg" width="367" height="432" viewBox="0 0 367 432" role="img" aria-labelledby="title desc">
  <title id="title">Exemple de capture SMS pour le temps supplémentaire</title>
  <desc id="desc">Message daté approuvant le temps supplémentaire et réponse de trente minutes.</desc>
