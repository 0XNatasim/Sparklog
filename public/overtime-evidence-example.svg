<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title description">
  <title id="title">Overtime SMS screenshot example</title>
  <description id="description">A closely cropped message conversation showing the date, a manager approving overtime, and an employee confirming thirty minutes.</description>
  <rect width="720" height="900" rx="36" fill="#f4f4f5"/>
  <rect x="0" y="0" width="720" height="128" rx="36" fill="#ffffff"/>
  <rect x="0" y="92" width="720" height="36" fill="#ffffff"/>
  <circle cx="360" cy="57" r="28" fill="#d4d4d8"/>
  <text x="360" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Gestionnaire</text>
  <text x="360" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#71717a">22 août 2026</text>

  <g font-family="Arial, sans-serif" font-size="22" fill="#18181b">
    <rect x="38" y="218" width="475" height="116" rx="28" fill="#e4e4e7"/>
    <text x="66" y="262">Peux-tu rester pour terminer</text>
    <text x="66" y="294">le travail en temps supplémentaire?</text>
    <text x="66" y="322" font-size="15" fill="#71717a">16:42</text>

    <rect x="205" y="370" width="477" height="116" rx="28" fill="#2563eb"/>
    <text x="233" y="414" fill="#ffffff">Oui. Combien de temps?</text>
    <text x="654" y="474" text-anchor="end" font-size="15" fill="#dbeafe">16:44</text>

    <rect x="38" y="522" width="500" height="116" rx="28" fill="#e4e4e7"/>
    <text x="66" y="566">J’autorise 30 minutes de temps</text>
    <text x="66" y="598">supplémentaire aujourd’hui.</text>
    <text x="66" y="626" font-size="15" fill="#71717a">16:45</text>

    <rect x="272" y="674" width="410" height="116" rx="28" fill="#2563eb"/>
    <text x="300" y="718" fill="#ffffff">Confirmé, je fais 30 min.</text>
    <text x="654" y="778" text-anchor="end" font-size="15" fill="#dbeafe">16:46</text>
  </g>

  <text x="360" y="852" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#71717a">Cadrage serré · date + autorisation + durée</text>
</svg>
